<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" role="img"><title>Operand delays align transactions; a constant coefficient column bypasses registers and joins the product compression</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#747d86"/></marker></defs>
<rect width="100%" height="100%" fill="#faf9f6"/>
<text x="450" y="25" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#41484b">Operand stages</text>
<rect x="25" y="50" width="160" height="47" rx="4" fill="#f5f1e8" stroke="#3d6f8c" stroke-width="1.5"/>
<text x="105.0" y="79.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">sᵢ · stage 2</text>
<rect x="25" y="115" width="160" height="50" rx="4" fill="#f5f1e8" stroke="#77878e" stroke-width="1.5"/>
<text x="105.0" y="146.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">tᵢ · stage 0</text>
<rect x="705" y="50" width="170" height="90" rx="4" fill="#f5f1e8" stroke="#3d6f8c" stroke-width="1.5"/>
<text x="790.0" y="89.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">Booth product rows</text>
<text x="790.0" y="112.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">sᵢ × tᵢ</text>
<path d="M185 74 H705" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="320" y="115" width="90" height="50" rx="4" fill="#f5f1e8" stroke="#3d6f8c" stroke-width="1.5"/>
<text x="365.0" y="146.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">R1</text>
<path d="M185 140 H320" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="515" y="115" width="90" height="50" rx="4" fill="#f5f1e8" stroke="#3d6f8c" stroke-width="1.5"/>
<text x="560.0" y="146.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">R2</text>
<path d="M410 140 H515" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M605 140 H650 V116 H705" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#41484b">Delay tᵢ by two cycles to pair it with sᵢ.</text>
<text x="450" y="227" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#41484b">Constant coefficient bits</text>
<rect x="25" y="255" width="160" height="45" rx="4" fill="#f5f1e8" stroke="#77878e" stroke-width="1.5"/>
<text x="105.0" y="283.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">c[21:0]</text>
<rect x="320" y="255" width="90" height="45" rx="4" fill="#f5f1e8" stroke="#77878e" stroke-width="1.5"/>
<text x="365.0" y="283.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">R1</text>
<path d="M185 278 H320" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="515" y="255" width="90" height="45" rx="4" fill="#f5f1e8" stroke="#77878e" stroke-width="1.5"/>
<text x="560.0" y="283.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">R2</text>
<path d="M410 278 H515" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="705" y="255" width="170" height="85" rx="4" fill="#f5f1e8" stroke="#3d6f8c" stroke-width="1.5"/>
<text x="790.0" y="280.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">product rows</text>
<text x="790.0" y="303.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">+ aligned c</text>
<text x="790.0" y="326.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">compress together</text>
<path d="M605 278 H705" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M790 140 V255" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="25" y="320" width="160" height="65" rx="4" fill="#f5f1e8" stroke="#77878e" stroke-width="1.5"/>
<text x="105.0" y="347.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">c[22] in all rows</text>
<text x="105.0" y="370.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">1 1 1 … 1</text>
<rect x="255" y="330" width="90" height="45" rx="4" fill="#f5f1e8" stroke="#3d6f8c" stroke-width="1.5"/>
<text x="300.0" y="358.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">literal 1</text>
<path d="M185 352 H255" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M345 352 H650 V315 H705" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">no c[22] registers</text>
<rect x="705" y="405" width="170" height="55" rx="4" fill="#f5f1e8" stroke="#3d6f8c" stroke-width="1.5"/>
<text x="790.0" y="438.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">carry completion</text>
<path d="M790 340 V405" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="482" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">The coefficient enters compression before the product is converted to an ordinary binary sum.</text>
</svg>

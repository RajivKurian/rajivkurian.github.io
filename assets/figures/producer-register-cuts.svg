<path d="M820 225 V284" stroke="#af5137" stroke-width="5"/>
<text x="465" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#41484b">Later cuts store fewer signals, but require more dependent work before the register.</text>

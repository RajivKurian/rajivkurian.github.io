<path d="M537 148 V207" stroke="#9a681c" stroke-width="5"/>
<text x="20" y="257" text-anchor="start" font-family="system-ui,sans-serif" font-size="17" fill="#af5137">6 stored bits</text>
<rect x="290" y="232" width="225" height="43" rx="3" fill="#f5f1e8" stroke="#75828a" stroke-width="1.5"/>
<text x="402.5" y="258.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">FA₁: p10 + p01 + b1</text>
<rect x="560" y="232" width="225" height="43" rx="3" fill="#f5f1e8" stroke="#75828a" stroke-width="1.5"/>
<text x="672.5" y="258.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">FA₂: p20 + p11 + c2</text>

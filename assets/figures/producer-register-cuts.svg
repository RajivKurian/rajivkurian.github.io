<text x="402.5" y="181.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">FA₁: p10 + p01 + b1</text>
<rect x="560" y="155" width="225" height="43" rx="3" fill="#f5f1e8" stroke="#75828a" stroke-width="1.5"/>
<text x="672.5" y="181.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">FA₂: p20 + p11 + c2</text>
<path d="M210 177 H290" fill="none" stroke="#75828a" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M515 177 H560" fill="none" stroke="#75828a" stroke-width="1.7" marker-end="url(#arrow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 575" role="img"><title>Eight quadratic rows and two cubic rows: table selection and Horner pipelines</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#747d86"/></marker></defs>
<rect width="100%" height="100%" fill="#faf9f6"/>
<rect x="210" y="15" width="350" height="75" rx="4" fill="#f5f1e8" stroke="#d8d4ca"/>
<text x="385.0" y="37.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">FP32 input x</text>
<text x="385.0" y="57.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Unpack: n = floor(x), f = x − n</text>
<text x="385.0" y="77.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Retain F fractional bits of f</text>
<path d="M385 90 V105 H5 V365 H20" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M5 185 H20" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="24" y="97" text-anchor="start" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">fraction f</text>
<path d="M560 52 H760 V527 H560" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="736" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">n</text>
<text x="20" y="138" text-anchor="start" font-family="system-ui,sans-serif" font-size="14" fill="#1460aa">Eight quadratics · two arithmetic stages</text>
<rect x="20" y="150" width="140" height="70" rx="4" fill="#f5f1e8" stroke="#d8d4ca"/>
<text x="90.0" y="170.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Top 3 bits → j</text>
<text x="90.0" y="190.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Other F−3 bits</text>
<text x="90.0" y="210.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">→ residual t</text>
<rect x="185" y="150" width="120" height="70" rx="4" fill="#f5f1e8" stroke="#d8d4ca"/>
<text x="245.0" y="180.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">8-row table</text>
<text x="245.0" y="200.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">a, b, c</text>
<path d="M160 185 H185" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335" y="150" width="155" height="70" rx="4" fill="#f5f1e8" stroke="#1460aa"/>
<text x="412.5" y="180.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">s = a·t + b</text>
<text x="412.5" y="200.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">round → register</text>
<rect x="545" y="150" width="155" height="70" rx="4" fill="#f5f1e8" stroke="#1460aa"/>
<text x="622.5" y="180.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">y = s·t + c</text>
<text x="622.5" y="200.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">round → register</text>
<path d="M305 185 H335" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490 185 H545" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="517" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#41484b">s</text>
<text x="517" y="237" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#41484b">carry t, c</text>
<path d="M90 220 V265 H412 V220" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="237" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#41484b">t: F−3 bits</text>
<path d="M700 185 H730 V470 H385 V490" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="20" y="318" text-anchor="start" font-family="system-ui,sans-serif" font-size="14" fill="#c43c28">Two cubics · three arithmetic stages</text>
<rect x="20" y="330" width="140" height="70" rx="4" fill="#f5f1e8" stroke="#d8d4ca"/>
<text x="90.0" y="350.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Top 1 bit → j</text>
<text x="90.0" y="370.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Other F−1 bits</text>
<text x="90.0" y="390.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">→ residual t</text>
<rect x="185" y="330" width="120" height="70" rx="4" fill="#f5f1e8" stroke="#d8d4ca"/>
<text x="245.0" y="360.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">2-row table</text>
<text x="245.0" y="380.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">a, b, c, d</text>
<path d="M160 365 H185" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335" y="330" width="110" height="70" rx="4" fill="#f5f1e8" stroke="#c43c28"/>
<text x="390.0" y="360.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">s = a·t + b</text>
<text x="390.0" y="380.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">round → reg.</text>
<rect x="465" y="330" width="110" height="70" rx="4" fill="#f5f1e8" stroke="#c43c28"/>
<text x="520.0" y="360.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">r = s·t + c</text>
<text x="520.0" y="380.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">round → reg.</text>
<rect x="595" y="330" width="110" height="70" rx="4" fill="#f5f1e8" stroke="#c43c28"/>
<text x="650.0" y="360.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">y = r·t + d</text>
<text x="650.0" y="380.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">round → reg.</text>
<path d="M305 365 H335" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M445 365 H465" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M575 365 H595" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="453" y="419" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#41484b">carry t, c, d</text>
<text x="590" y="419" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#41484b">carry t, d</text>
<path d="M90 400 V445 H390 V400" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="235" y="437" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#41484b">t: F−1 bits</text>
<path d="M705 365 H730" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210" y="490" width="350" height="70" rx="4" fill="#f5f1e8" stroke="#d8d4ca"/>
<text x="385.0" y="520.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Reconstruct 2ⁿ·y; round and pack FP32</text>
<text x="385.0" y="540.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">n travels with the corresponding input</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img"><title>Coefficient table and the two fixed-format multiply-adds</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#747d86"/></marker></defs>
<rect width="100%" height="100%" fill="#faf9f6"/>
<text x="450" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#41484b">Polynomial and formats</text>
<rect x="25" y="55" width="210" height="80" rx="4" fill="#f5f1e8" stroke="#77878e" stroke-width="1.5"/>
<text x="130.0" y="89.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#41484b">256-row table</text>
<text x="130.0" y="112.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#41484b">a: 8 · b: 13 · c: 23 bits</text>
<rect x="310" y="55" width="210" height="80" rx="4" fill="#f5f1e8" stroke="#3d6f8c" stroke-width="1.5"/>
<text x="415.0" y="89.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">s = Q₁(a·t + b)</text>
<text x="415.0" y="112.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">15-bit first result</text>
<rect x="650" y="55" width="210" height="80" rx="4" fill="#f5f1e8" stroke="#3d6f8c" stroke-width="1.5"/>
<text x="755.0" y="89.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">y = Q₂(s·t + c)</text>
<text x="755.0" y="112.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">25-bit result</text>
<path d="M235 90 H310" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M520 90 H650" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#41484b">s</text>
<path d="M235 120 H275 V180 H620 V110 H650" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">carry c to the second multiply-add</text>
<path d="M90 218 H755 V135" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M415 218 V135" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="210" text-anchor="start" font-family="system-ui,sans-serif" font-size="16" fill="#41484b">t: 18 bits</text>
</svg>

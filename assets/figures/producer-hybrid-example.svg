<text x="450" y="645" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">●  Generate/propagate pair     ↙  Combine adjacent groups</text>
<text x="450" y="675" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Ticks above each column count its longest incoming FA path.</text>
<text x="450" y="703" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#41484b">The upper group produces k₄ directly from k₂, in parallel with k₃.</text>

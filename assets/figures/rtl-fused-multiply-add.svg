<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" role="img"><title>Booth product rows and the aligned addend share one carry-save reduction network</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#747d86"/></marker></defs>
<rect width="100%" height="100%" fill="#faf9f6"/>
<rect x="15" y="65" width="210" height="135" rx="4" fill="#f5f1e8" stroke="#1460aa"/>
<text x="120.0" y="107.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Select 0, ±t, ±2t</text>
<text x="120.0" y="127.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">shift each Booth digit</text>
<text x="120.0" y="147.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">add sign corrections</text>
<text x="120.0" y="167.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">include aligned b</text>
<path d="M225 132 H270" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="270" y="80" width="185" height="105" rx="4" fill="#f5f1e8" stroke="#d8d4ca"/>
<text x="362.5" y="117.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">3:2 compressors</text>
<text x="362.5" y="137.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">reduce to two rows</text>
<text x="362.5" y="157.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">local sum/carry bits</text>
<path d="M455 132 H505" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 111L600 111" stroke="#1460aa" stroke-width="4" fill="none"/>
<path d="M505 144L600 144" stroke="#1460aa" stroke-width="4" fill="none"/>
<text x="552" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#41484b">two upper rows</text>
<path d="M610 83L610 175" stroke="#b65322" stroke-width="5" fill="none"/>
<text x="610" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#b65322">register cut</text>
<path d="M615 132 H660" fill="none" stroke="#747d86" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="660" y="80" width="175" height="105" rx="4" fill="#f5f1e8" stroke="#1460aa"/>
<text x="747.5" y="117.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">Carry completion</text>
<text x="747.5" y="137.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">+ narrowing</text>
<text x="747.5" y="157.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#41484b">first result s</text>
<text x="425" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#41484b">Each compressor preserves value: three rows → sum row + shifted carry row.</text>
<text x="425" y="279" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#41484b">The low-column carry and rounding information cross the register cut too.</text>
</svg>
